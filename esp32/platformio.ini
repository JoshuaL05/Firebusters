; PlatformIO config (VS Code + PlatformIO extension). Build/upload from the esp32/ folder.
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo
    waspinator/AccelStepper
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
