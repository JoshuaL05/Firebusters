; PlatformIO config (VS Code + PlatformIO extension). Build/upload from the esp32/ folder.
[platformio]
src_dir = .

[env:feather_v2]
platform = espressif32
board = adafruit_feather_esp32_v2   ; Adafruit ESP32 Feather V2
framework = arduino
monitor_speed = 115200
monitor_echo = yes                  ; show what you type in the serial monitor
monitor_eol = LF
monitor_filters = send_on_enter     ; send the whole line when you press Enter
build_src_filter = +<main.cpp>
lib_deps =
    madhephaestus/ESP32Servo
    waspinator/AccelStepper